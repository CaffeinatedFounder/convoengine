nd Secretkeepers. You decide what each trusted contact can see, what they get, and what they know. Each trusted contact's identity is verified through Aadhaar-based KYC via DigiLocker, ensuring that only verified individuals can be added as trusted contacts. You can assign specific vault items, will sections, and messages to specific trusted contacts.", "category": "features"}, {"title": "Security and Data Protection", "content": "Afterlife takes security extremely seriously. Here are the key security measures: 1) One User, One KYC, One Device \u2014 your account is tied to a single verified identity and device. 2) Passkey-enabled secure login with a six-digit PIN \u2014 password-less, phishing-resistant authentication. 3) End-to-End Encryption (E2EE) \u2014 all files and messages are encrypted on your device before transmission and remain encrypted until the recipient accesses them. 4) Geo-Redundant Storage (GRS) \u2014 encrypted data is replicated across geographically distant locations for disaster recovery. 5) Digital signatures are applied to all files and messages, ensuring they remain unaltered. 6) Comprehensive logging and monitoring \u2014 all access events are logged in an encrypted, tamper-proof audit trail. 7) ISO-certified security standards. 8) Aadhaar-based KYC verification via DigiLocker integration. All data is stored within India through Microsoft Azure.", "category": "security"}, {"title": "KYC Verification Process", "content": "Afterlife uses Aadhaar-based KYC (Know Your Customer) verification via direct integration with DigiLocker. As a verified DigiLocker partner, Afterlife ensures a secure and reliable identity verification process. During sign-up, you will be asked to verify your identity through DigiLocker using your Aadhaar number. This verification is mandatory to ensure the security of the platform and protect all users. Your trusted contacts also undergo Aadhaar-based KYC verification. The KYC process collects: full name, contact number, o the right people, and ensure a seamless transition when the time comes.", "category": "general"}, {"title": "Compliance and Certifications", "content": "Afterlife is compliant with: the Information Technology Act 2000, the Information Technology (Intermediary Guidelines and Digital Media Ethics Code) Rules 2021, and the Digital Personal Data Protection Act 2023 (India). The company is ISO-certified and follows globally recognised information security standards. Afterlife is a verified DigiLocker partner for Aadhaar-based KYC verification. All data is stored in India through Microsoft Azure with geo-redundant storage for disaster recovery.", "category": "security"}, {"title": "How to Get the App", "content": "Afterlife is available as a mobile app on both iOS and Android: Download from the Apple App Store for iPhone, download from the Google Play Store for Android devices. You can also access the web version at app.myafterlife.in. The main website is www.myafterlife.in. To get started, download the app, sign up, complete your KYC verification, and start organising your digital legacy.", "category": "process"}, {"title": "Refund and Payment Information", "content": "Afterlife accepts payments through PayU payment gateway. The pricing is a one-time lifetime payment of \u20b97,999 + GST (currently \u20b93,999 + GST during the promotional offer). For any questions about payments, refunds, or billing, you can contact support at support@myafterlife.in or call +91 7045974877. You can also raise a grievance with the Grievance Redressal Officer Sheetal Koul at grievance@myafterlife.in. Complaints are acknowledged within 48 hours and resolved within 15 working days.", "category": "pricing"}, {"title": "Afterlife for Businesses (B2B)", "content": "Afterlife works with financial advisors, wealth managers, insurance companies, and other financial institutions as a B2B partner. If you are a financial advisor or represent a company and want to offer Afterlife as a value-added ser Your data is encrypted and stored with geo-redundant backups. The company follows data retention policies in compliance with Indian law.", "category": "faq"}, {"title": "Nominee vs Beneficiary \u2014 What Most People Get Wrong", "content": "A common misconception in India is that naming a nominee means they automatically inherit your assets. In reality, a nominee is legally only a custodian or trustee \u2014 like a 'postman' for your wealth. The nominee holds the asset temporarily until it is distributed to the legal heirs. If there is a dispute between the nominee and the legal heirs, the legal heirs typically prevail in court. This is why naming a nominee is only half the job \u2014 a Will is what completes it. A simple Will avoids 90% of family disputes and cuts through months of banking and legal processes. Afterlife helps you understand this distinction and plan accordingly with both trusted contacts and a Digital Will.", "category": "education"}, {"title": "Will Writing in India \u2014 Why It Matters", "content": "63% of succession cases in Indian courts stem from the absence of a Will. Over 3 crore cases are still pending in courts related to succession disputes. In western countries, over 70% of the population above 40 years of age has a will, compared to less than 20% in India. You do not need a lawyer to write a valid Will in India \u2014 that is a myth. Afterlife's Digital Will feature lets you create and update your will in minutes from your phone. While the Digital Will is a comprehensive succession planning document, for legal registration you would follow the standard legal process. Having a clear Will gives your family direction and avoids disputes, delays, and confusion.", "category": "education"}, {"title": "The Forgotten File \u2014 Corporate Workshops by Afterlife", "content": "Afterlife conducts 'The Forgotten File' \u2014 a corporate workshop (virtual or physical) that opens employees' eyes to the gap between financial planning and financial ac data is exclusive to each partner and never shared across the platform. Partners benefit from increased renewals through proactive alerts, boosted upsells with real-time financial insights, deeper trust through consistent engagement, and organic growth through satisfied client referrals.", "category": "b2b"}, {"title": "NRI Support \u2014 On-Ground Assistance in India", "content": "Afterlife provides on-ground support in India specifically for NRIs (Non-Resident Indians) and their families. Living abroad does not eliminate responsibilities back home. Afterlife ensures your family and assets in India are supported professionally and transparently, without the need for frequent travel. The NRI support includes: insurance disputes and rejected claims with end-to-end handholding for documentation and escalation, real estate and succession-related matters including ownership clarity and coordination with legal experts, litigation coordination through trusted partners for insurance or property-related legal matters, and family support on the ground as a single point of coordination. From claims to succession clarity, Afterlife supports NRIs until the matter reaches a defined outcome.", "category": "features"}, {"title": "Six Pillars of Financial Planning", "content": "Afterlife educates users about the six financial pillars that constitute true financial security: 1) Tax Planning, 2) Investment Diversification, 3) Risk Mitigation, 4) Insurance Planning, 5) Succession Planning, and 6) Organizing Information. Most people focus on earning and investing but neglect the last two pillars \u2014 succession planning and organizing information. Succession planning and information organisation are the pillars that Afterlife specifically addresses. Without these, even well-planned finances can become inaccessible to your family. As Afterlife puts it: 'Earning is only half the battle. True security comes from mastering all six financial pillars.'", "category": "education"}, {"title": re typically scattered across physical lockers, email accounts, cloud storage, and various institutions. Document Discovery assists in systematically identifying and retrieving these critical documents, reducing the time and stress involved in the claim and succession process. This is available as part of Afterlife's ancillary services.", "category": "features"}, {"title": "Afterlife Messaging \u2014 Leave Nothing Unsaid", "content": "Afterlife Messaging is your superpower to get your messages delivered even after you are gone. You can write, record videos, and capture your unexpressed emotions, wishes, important instructions, and more for your loved ones. Messages can be scheduled for specific dates \u2014 like a birthday wish for your grandchild years from now \u2014 or triggered by specific events including posthumous delivery. Think of it as ensuring your voice, wisdom, and love reach the people who matter most, exactly when they need it. Whether it is a message of comfort for your spouse, career advice for your children, or simply saying 'I love you' one more time \u2014 Afterlife ensures nothing is left unsaid.", "category": "features"}, {"title": "The Unclaimed Wealth Crisis in India \u2014 Key Statistics", "content": "The scale of unclaimed wealth in India is staggering. Over \u20b978,213 crore lies unclaimed in bank accounts (RBI, May 2024). \u20b922,000 crore lies unclaimed with life insurance companies (Times of India, Jan 2025). More than \u20b954,658 crore lies unclaimed in inoperative EPF accounts (MoneyLife, Aug 2024). The total of forgotten wealth of ordinary Indians exceeds \u20b92,00,000 crore locked in unclaimed assets (MoneyLife, Aug 2024). Behind every number is a story \u2014 a family unable to access what was rightfully theirs. Forgotten deposits, lost policies, unclaimed pensions \u2014 each one represents someone's hard-earned effort left behind. Afterlife exists to ensure this does not happen to your family.", "category": "education"}, {"title": "Before and After \u2014 Life with Afterlife", "content": "Without Afterlife: Important information is scattered online, offline, and some still in your thoughts. Delivery of information after you is uncertain, difficult, and partial. Expressing love, emotions, and wishes posthumously is not possible. The fate of social media accounts is uncertain and vulnerable. Insurance and other benefits go unused. Creating a will is obscure, tedious, and inconvenient. Asset discovery and claim assistance is a nightmare. You are stressed about what will happen to your loved ones. With Afterlife: All information is organised and accessible in one place. Assured delivery of complete information without hassle. Expressing your love and wishes posthumously is possible with ease. You have complete control over social media account access and closure. Easy access and recall of financial benefits. Will creation is convenient, digital, and simplified. Claim assistance is guided and optimised. You have control and peace of mind.", "category": "general"}, {"title": "Afterlife Gifting", "content": "Afterlife Gifting is an AI-powered personal gifting assistance feature available to subscribers. It allows you to plan and schedule gifts for your loved ones \u2014 both during your lifetime and beyond. Whether it is a birthday gift, anniversary surprise, or a special something you want delivered after you are gone, Afterlife Gifting uses AI to help you choose meaningful gifts and ensure they reach the right person at the right time. This feature embodies Afterlife's philosophy of being 'Your friend for Life and Beyond' \u2014 helping you express love and care through thoughtful gestures, even when you cannot be there in person.", "category": "features"}, {"title": "Mental Health and Legacy Planning", "content": "The uncertainty around succession planning does not just impact finances \u2014 it takes a toll on mental wellbeing. Common emotional burdens include stress about whether your family will find your assets, anxiety about unresolved disputes, fear of the unknown regarding what happens to your digital presence, financial insecurity for dependents, constant worry about incomplete preparation, and loss of focus on daily life. Afterlife addresses these emotional burdens by providing certainty, assurance, and peace of mind. When you know your information is organised, assigned, and will be delivered to the right people, the mental load lifts. Preparedness is not tomorrow's job \u2014 it is today's. As Afterlife says: 'Peace of mind can be planned.'", "category": "education"}];

const logEl = document.getElementById('log');
function log(msg, cls='') { logEl.innerHTML += `<span class="${cls}">${msg}</span>\n`; window.scrollTo(0, document.body.scrollHeight); }

async function getEmbedding(text) {
  const res = await fetch('https://api.openai.com/v1/embeddings', {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${OPENAI_KEY}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: 'text-embedding-3-small', input: text })
  });
  if (!res.ok) throw new Error(`OpenAI ${res.status}: ${await res.text()}`);
  const data = await res.json();
  return data.data[0].embedding;
}

async function supabaseInsert(row) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/knowledge_articles`, {
    method: 'POST',
    headers: {
      'apikey': SERVICE_KEY,
      'Authorization': `Bearer ${SERVICE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal'
    },
    body: JSON.stringify(row)
  });
  if (!res.ok) throw new Error(`Supabase ${res.status}: ${await res.text()}`);
}

async function checkExisting() {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/knowledge_articles?select=title&tenant_id=eq.${TENANT_ID}`, {
    headers: { 'apikey': SERVICE_KEY, 'Authorization': `Bearer ${SERVICE_KEY}` }
  });
  if (!res.ok) throw new Error(`Check failed: ${await res.text()}`);
  return (await res.json()).map(a => a.title);
}

async function main() {
  log(`Found ${articles.length} articles to seed`, 'info');

  let existingTitles;
  try {
    existingTitles = new Set(await checkExisting());
    log(`${existingTitles.size} already in DB`, 'info');
  } catch(e) {
    log(`Error checking existing: ${e.message}`, 'err');
    existingTitles = new Set();
  }

  const newArticles = articles.filter(a => !existingTitles.has(a.title));
  if (newArticles.length === 0) { log('All articles exist. Done!', 'ok'); return; }
  log(`${newArticles.length} new articles to insert\n`, 'info');

  let success = 0, failed = 0;
  for (let i = 0; i < newArticles.length; i++) {
    const a = newArticles[i];
    try {
      log(`[${i+1}/${newArticles.length}] ${a.title}...`);
      const embedding = await getEmbedding(`${a.title}\n\n${a.content}`);
      await supabaseInsert({
        tenant_id: TENANT_ID,
        title: a.title,
        content: a.content,
        category: a.category,
        embedding: JSON.stringify(embedding),
        is_active: true
      });
      log(`  ✅ Done`, 'ok');
      success++;
      if (i < newArticles.length - 1) await new Promise(r => setTimeout(r, 300));
    } catch(e) {
      log(`  ❌ ${e.message}`, 'err');
      failed++;
    }
  }
  log(`\n=============================`, 'info');
  log(`SEEDING COMPLETE`, 'ok');
  log(`Success: ${success}  |  Failed: ${failed}  |  Total: ${existingTitles.size + success}`, 'ok');
  log(`SEEDER_DONE`, 'ok');
}
main();
</script>
